<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitrina del comercio | PLAN A</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#0d1228;color:#fff}a{color:inherit}.top{padding:17px 5%;background:#11172d;border-bottom:1px solid #ffffff25;display:flex;justify-content:space-between;align-items:center}.top strong{font-size:23px}.top b{color:#f78abc}.wrap{max-width:1150px;margin:24px auto;padding:0 20px}.store{border:1px solid #62456f;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,#19152e,#292045)}.store.family{background:linear-gradient(135deg,#e5faff,#fff6de);color:#18344b;border-color:#a3e7db}.cover{min-height:250px;padding:28px;display:flex;align-items:end;gap:20px;background:radial-gradient(circle at 85% 20%,#e04ba0,transparent 35%),linear-gradient(120deg,#241333,#17254a);position:relative;overflow:hidden}.family .cover{background:radial-gradient(circle at 85% 20%,#ffe28b,transparent 35%),linear-gradient(120deg,#a3e8ee,#c4f4d5)}.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover>img:after{content:''}.identity{position:relative;z-index:1;display:flex;align-items:center;gap:18px}.avatar{height:86px;width:86px;border-radius:23px;background:#fff;display:grid;place-items:center;font-size:44px;color:#173047;border:3px solid white;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:contain}.cover h1{font-size:clamp(30px,5vw,54px);line-height:1.1;margin:8px 0;letter-spacing:-1px}.content{padding:clamp(18px,4vw,35px)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.actions a{padding:12px 17px;background:#ee86bb;color:#23142e;border-radius:13px;font-weight:800;text-decoration:none}.family .actions a{background:#008c9c;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.panel{padding:22px;background:#ffffff0c;border:1px solid #ffffff30;border-radius:19px}.family .panel{background:#fff;border-color:#b6e7e0}.panel h2{font-size:21px;margin:0 0 13px}.panel p{line-height:1.6}.full{grid-column:1/-1}.muted{opacity:.75}.empty{padding:17px;border:1px dashed #8887;border-radius:12px}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}.photos img{width:100%;height:155px;object-fit:cover;border-radius:12px}.photos h3{font-size:16px}#error{padding:25px;border:1px solid #e77;border-radius:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.cover{min-height:220px;padding:17px}.avatar{height:64px;width:64px;font-size:30px}}</style></head><body><header class="top"><strong>PLAN <b>A</b></strong><a href="/">← Volver a explorar</a></header><main class="wrap" id="app"><p>Cargando vitrina...</p></main><script>
(async function(){
const app=document.getElementById('app');const id=new URLSearchParams(location.search).get('id');const el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x};
try{const response=await fetch('/data/venue-directory-seed.json',{cache:'no-store'});if(!response.ok)throw Error('No se pudo cargar el directorio');const data=await response.json();const v=data.venues.find(x=>x.id===id);if(!v)throw Error('Comercio no encontrado');
document.title=v.name+' | PLAN A';const family=v.section==='Para toda la familia';app.replaceChildren();const store=el('article','store'+(family?' family':''));const cover=el('div','cover');if(v.photoUrl&&v.photoVerified){const photo=document.createElement('img');photo.src=v.photoUrl;photo.alt='Foto de '+v.name;photo.onerror=()=>photo.remove();cover.appendChild(photo)}
const identity=el('div','identity'),avatar=el('div','avatar');if(v.logoUrl&&v.logoVerified){const logo=document.createElement('img');logo.src=v.logoUrl;logo.alt='Logo de '+v.name;logo.onerror=()=>{avatar.textContent=family?'🎡':'🌃'};avatar.appendChild(logo)}else avatar.textContent=family?'🎡':'🌃';identity.appendChild(avatar);const intro=el('div');intro.appendChild(el('span','',v.category+' · '+v.section));intro.appendChild(el('h1','',v.name));identity.appendChild(intro);cover.appendChild(identity);store.appendChild(cover);const content=el('div','content');content.appendChild(el('p','',v.description));const actions=el('div','actions');for(const [url,label] of [[v.mapsUrl,'📍 Cómo llegar'],[v.website,'Sitio web'],[v.menuUrl,'Consultar menú']]){if(!url)continue;const a=el('a','',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';actions.appendChild(a)}content.appendChild(actions);const grid=el('div','grid');
const info=el('section','panel');info.appendChild(el('h2','','Sobre el comercio'));info.appendChild(el('p','',v.description));info.appendChild(el('p','','📍 '+v.address));grid.appendChild(info);
const hours=el('section','panel');hours.appendChild(el('h2','','Horarios de apertura'));if(v.openingHours){for(const [day,time] of Object.entries(v.openingHours))hours.appendChild(el('p','',day+': '+time));hours.appendChild(el('p','muted','Horarios de referencia; confirmar con el comercio'))}else hours.appendChild(el('div','empty','Horarios pendientes de confirmar'));grid.appendChild(hours);
const products=el('section','panel full');products.appendChild(el('h2','',family?'Actividades y servicios':'Productos y menú'));const items=Array.isArray(v.products)?v.products.filter(x=>x.name&&x.photoUrl&&x.photoVerified):[];if(items.length){const photos=el('div','photos');for(const p of items){const item=el('div');const img=document.createElement('img');img.src=p.photoUrl;img.alt=p.name;item.appendChild(img);item.appendChild(el('h3','',p.name));if(p.description)item.appendChild(el('p','',p.description));if(p.price)item.appendChild(el('p','',String(p.price)));photos.appendChild(item)}products.appendChild(photos)}else{const categories=family?['Actividades recreativas','Experiencias familiares','Servicios del establecimiento']:['Bebidas y coctelería','Comidas y picaderas','Servicios del establecimiento'];const wrap=el('div','photos');for(const label of categories){const tile=el('div','empty');tile.appendChild(el('h3','',label));tile.appendChild(el('p','muted','Consulta la disponibilidad y precios directamente con el comercio.'));wrap.appendChild(tile)}products.appendChild(wrap)}if(v.menuUrl){const a=el('a','',v.menuLabel||'📖 Consultar carta o servicios publicados');a.href=v.menuUrl;a.target='_blank';a.rel='noopener noreferrer';products.appendChild(a)}grid.appendChild(products);
const gallery=el('section','panel full');gallery.appendChild(el('h2','','Galería del establecimiento'));const images=Array.isArray(v.gallery)?v.gallery.filter(x=>x.url&&x.verified):[];if(images.length){const photos=el('div','photos');for(const p of images){const img=document.createElement('img');img.src=p.url;img.alt=p.alt||v.name;photos.appendChild(img)}gallery.appendChild(photos)}else{const photoSources={'maps-seed-1':['https://onnosdr.com/zona-colonial'],'maps-seed-2':['https://mosquitosocialclub.com/'],'maps-seed-3':['https://es.restaurantguru.com/75-Grados-Santo-Domingo-2'],'maps-seed-9':['https://www.funhouserd.com/'],'maps-seed-10':['https://leparc.do/']};const urls=[...(photoSources[v.id]||[]),v.mapsUrl].filter(Boolean);if(urls.length){gallery.appendChild(el('p','muted','Explora fotografías publicadas por el establecimiento o en su ficha de ubicación. Las imágenes externas no se copian sin permiso.'));for(const [i,url] of urls.entries()){const a=el('a','',i===0&&photoSources[v.id]?'📷 Ver fotografías en el sitio del establecimiento':'📍 Ver fotos en Google Maps');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.style.cssText='display:inline-block;padding:12px 16px;margin:6px 9px 6px 0;border-radius:12px;background:#ffffff20';gallery.appendChild(a)}}else gallery.appendChild(el('p','muted','Aún no hay fuentes fotográficas verificadas.'))}grid.appendChild(gallery);content.appendChild(grid);store.appendChild(content);app.appendChild(store);
}catch(e){app.replaceChildren(el('div','', 'No se pudo abrir la ficha: '+e.message));}
})();
</script></body></html>
