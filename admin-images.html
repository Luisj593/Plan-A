<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan A · Investigador de imágenes</title><style>body{font:16px system-ui;background:#101827;color:#f7fafc;margin:0}main{max-width:1100px;margin:auto;padding:30px 18px}h1{font-size:30px}p{color:#b7c3d5}label{display:block;margin:18px 0 7px}input,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #52627b;background:#19263a;color:white}input{width:min(95%,500px)}button{background:#635bff;border:0;cursor:pointer}a{color:#a7c4ff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:22px}.item{background:#1c2a3d;border-radius:14px;overflow:hidden;padding-bottom:12px}.item img{width:100%;height:160px;object-fit:cover;background:#28374b}.item p,.item a{margin:10px;display:block;overflow-wrap:anywhere;font-size:13px}.notice{padding:14px;background:#26344a;border-radius:12px;margin-top:16px}</style></head><body><main><a href="/">← Volver a Plan A</a><h1>Investigador de imágenes oficiales</h1><p>Busca imágenes en las páginas oficiales registradas de cada comercio. Los resultados son candidatos para revisión; no se descargan ni publican automáticamente.</p><label for="key">Token de administración</label><input id="key" type="password" autocomplete="off" placeholder="ADMIN_TOKEN"><label for="venue">Comercio</label><select id="venue"><option value="maps-seed-1">Onno’s Zona Colonial</option><option value="maps-seed-2">Mosquito Social Club</option><option value="maps-seed-3">75 Grados</option><option value="maps-seed-4">Los Reales Colmados</option><option value="maps-seed-5">Miami Hot</option><option value="maps-seed-6">La Gomera Street Bar</option><option value="maps-seed-7">Rotana Kids</option><option value="maps-seed-8">The Food Truck Stop</option><option value="maps-seed-9">Fun House</option><option value="maps-seed-10">Le Parc | Play & Chill</option></select><button id="search">Buscar imágenes</button><div class="notice" id="status" role="status">Selecciona un comercio y pulsa Buscar imágenes.</div><div id="results" class="grid"></div></main><script>const status=document.getElementById('status'),results=document.getElementById('results');document.getElementById('search').onclick=async()=>{results.replaceChildren();status.textContent='Consultando página oficial...';try{const id=document.getElementById('venue').value;const response=await fetch('/api/admin/venue-image-search?venueId='+encodeURIComponent(id),{headers:{authorization:'Bearer '+document.getElementById('key').value}});const data=await response.json();if(!response.ok)throw Error(data.error||'Error de consulta');status.textContent=data.name+': '+data.images.length+' imágenes candidatas. '+(data.website||'Sin página oficial registrada')+'. Verifica autorización antes de almacenarlas.';for(const p of data.images){const item=document.createElement('article');item.className='item';const img=document.createElement('img');img.src=p.url;img.loading='lazy';img.alt='Imagen candidata de '+data.name;const title=document.createElement('p');title.textContent=p.kind+' · Pendiente de autorización';const a=document.createElement('a');a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Abrir imagen original';item.append(img,title,a);results.append(item)}}catch(e){status.textContent=e.message}};</script></body></html>
