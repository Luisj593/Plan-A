<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan A · Iniciar sesión</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a1025;color:#fff;font:16px system-ui}.panel{width:min(440px,94vw);padding:30px;background:#151c34;border:1px solid #35405e;border-radius:24px}a{color:#ff9cc8}h1{margin:10px 0}p{color:#b9c1d9}label{display:block;margin:15px 0 6px}input,select,button{width:100%;padding:13px;border-radius:12px;font:inherit}input,select{background:#1b2642;border:1px solid #52627b;color:#fff}button{border:0;background:linear-gradient(120deg,#ed419d,#ff933f);color:white;font-weight:750;margin-top:20px;cursor:pointer}.tabs{display:flex;gap:8px}.tabs button{margin:0;background:#283550}.tabs button.active{background:#ed419d}.hidden{display:none}#message{min-height:22px;color:#ffbdc8}</style></head><body><main class="panel"><a href="/">← Volver a Plan A</a><h1>Bienvenido a Plan A</h1><p>Accede a tu cuenta de cliente o comercio.</p><div class="tabs"><button id="tab-login" class="active" type="button">Iniciar sesión</button><button id="tab-register" type="button">Crear cuenta</button></div><form id="form"><div id="register-fields" class="hidden"><label for="name">Nombre</label><input id="name" autocomplete="name"><label for="role">Tipo de cuenta</label><select id="role"><option value="client">Cliente</option><option value="merchant">Comercio</option></select></div><label for="email">Correo electrónico</label><input id="email" type="email" required autocomplete="email"><label for="password">Contraseña</label><input id="password" type="password" required minlength="12" autocomplete="current-password"><button id="submit">Iniciar sesión</button></form><p id="message" role="status"></p><div id="session" class="hidden"><p id="identity"></p><button id="logout" type="button">Cerrar sesión</button></div></main><script>let mode='login';const by=id=>document.getElementById(id),message=by('message');function select(m){mode=m;by('register-fields').classList.toggle('hidden',m!=='register');by('tab-login').classList.toggle('active',m==='login');by('tab-register').classList.toggle('active',m==='register');by('submit').textContent=m==='register'?'Crear cuenta':'Iniciar sesión';by('password').autocomplete=m==='register'?'new-password':'current-password';message.textContent=''}by('tab-login').onclick=()=>select('login');by('tab-register').onclick=()=>select('register');async function api(path,options={}){const r=await fetch('/api/auth/'+path,{credentials:'same-origin',...options});const data=await r.json();if(!r.ok)throw Error(data.error||'Solicitud fallida');return data}function show(user){by('form').classList.toggle('hidden',!!user);by('session').classList.toggle('hidden',!user);by('identity').textContent=user?user.name+' · '+(user.role==='super_admin'?'Super Admin':user.role==='merchant'?'Comercio'+(user.venueId?' · Establecimiento asignado':' · Pendiente de aprobación'):'Cliente'):'';message.textContent=user?'Sesión iniciada correctamente.':'';if(user&&user.role==='super_admin'){const a=document.createElement('a');a.href='/super-admin';a.textContent='Abrir panel Super Admin';by('identity').append(document.createElement('br'),a)}}by('form').onsubmit=async e=>{e.preventDefault();message.textContent='Procesando...';const body={email:by('email').value,password:by('password').value};if(mode==='register'){body.name=by('name').value;body.role=by('role').value}try{const result=await api(mode,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(mode==='register'){select('login');message.textContent=result.message}else show(result.user)}catch(err){message.textContent=err.message}};by('logout').onclick=async()=>{try{await api('logout',{method:'POST'});show(null);message.textContent='Sesión cerrada.'}catch(err){message.textContent=err.message}};api('me').then(x=>{if(x.user)show(x.user)}).catch(()=>{});</script></body></html>
