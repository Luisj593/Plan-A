<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan A · Mi sesión</title><style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#101827;color:white}header{padding:20px 5%;background:#18263b;display:flex;justify-content:space-between;gap:12px}main{max-width:1000px;margin:32px auto;padding:0 18px}a{color:#b7c9ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#1b2b42;border:1px solid #40516a;border-radius:16px;padding:22px}.card strong{display:block;font-size:19px;margin-bottom:8px}.card p{color:#b6c6d9}button{border:0;border-radius:9px;background:#e14b9e;color:white;padding:12px 18px;cursor:pointer}.muted{color:#b6c6d9}</style></head><body><header><strong>PLAN A · MI SESIÓN</strong><a href="/">Volver a explorar</a></header><main><h1 id="title">Cargando tus opciones…</h1><p id="status" class="muted"></p><div id="options" class="grid"></div><p><button id="logout">Cerrar sesión</button></p></main><script>const $=id=>document.getElementById(id);function add(title,description,href){const card=document.createElement('div');card.className='card';const strong=document.createElement('strong');strong.textContent=title;const p=document.createElement('p');p.textContent=description;const a=document.createElement('a');a.href=href;a.textContent='Abrir opción';card.append(strong,p,a);$('options').append(card)}fetch('/api/auth/me',{credentials:'same-origin'}).then(r=>r.json()).then(({user})=>{if(!user){location.replace('/acceso');return}if(user.role==='super_admin'){location.replace('/super-admin');return}if(location.pathname==='/mi-comercio'&&user.role!=='merchant'){location.replace('/mi-cuenta');return}if(location.pathname==='/mi-cuenta'&&user.role==='merchant'){location.replace('/mi-comercio');return}$('title').textContent='Hola, '+user.name;$('status').textContent=user.role==='merchant'?'Panel de comercio · '+(user.venueId?'Establecimiento asignado':'Pendiente de asignación de establecimiento'):'Panel de cliente';if(user.role==='merchant'){if(user.venueId)add('Mi establecimiento','Ver el perfil público de tu comercio','/comercio/'+encodeURIComponent(user.venueId));add('Explorar establecimientos','Consultar el directorio de Plan A','/');add('Administración de imágenes','La gestión de medios requiere autorización de Super Admin.','/admin/imagenes')}else{add('Explorar lugares','Buscar restaurantes, bares y actividades','/');add('Mis favoritos','Acceder a los lugares favoritos del directorio','/#favorites');add('Mi perfil','Ver las opciones de mi cuenta','/#account')}}).catch(()=>{$('status').textContent='No se pudo cargar la sesión. Intenta de nuevo.'});$('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});location.replace('/acceso')};</script></body></html>
