name: SD Social checks
on:
  push:
    branches: [main, feature/establishment-media-integrations]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check server.mjs
      - run: node --check integrations/establishment-media.mjs
