<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ServicioPro</title><style>body{margin:0;background:#f4f7fb;color:#17253b;font:15px system-ui}header{background:#10233d;color:white;padding:22px 6%}header b{font-size:25px}main{max-width:1080px;margin:32px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.card{background:white;border:1px solid #e0e6ef;border-radius:16px;padding:24px;box-shadow:0 5px 20px #18334d09}h2{margin-top:0}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{background:#1765d1;color:white;border:0;cursor:pointer;font-weight:650}button.secondary{background:#e9f0fc;color:#17447c}.hidden{display:none}.muted{color:#64748b}.item{border-bottom:1px solid #e5eaf0;padding:12px 0}.stats{font-size:32px;font-weight:750}#notice{min-height:24px;color:#a23b28}</style></head><body><header><b>⚙ ServicioPro</b><div>Gestión inteligente de servicios técnicos</div></header><main><p id="notice" role="status"></p><section id="access" class="grid"><div class="card"><h2>Registrar empresa</h2><form id="register"><input name="company" placeholder="Empresa" required><input name="name" placeholder="Administrador" required><input name="email" type="email" placeholder="Correo" required><input name="password" type="password" minlength="12" placeholder="Contraseña (12 caracteres mínimo)" required><button>Crear empresa</button></form></div><div class="card"><h2>Ingresar</h2><form id="login"><input name="companyId" placeholder="ID de empresa" required><input name="email" type="email" placeholder="Correo" required><input name="password" type="password" placeholder="Contraseña" required><button>Iniciar sesión</button></form></div></section><section id="dashboard" class="hidden"><div class="grid"><div class="card"><h2>Clientes</h2><div class="stats" id="customerCount">0</div><form id="customerForm"><input name="name" placeholder="Nombre del cliente" required><input name="phone" placeholder="Teléfono"><input name="address" placeholder="Dirección"><button>Guardar cliente</button></form><div id="customers"></div></div><div class="card"><h2>Órdenes de trabajo</h2><form id="orderForm"><select name="customerId" id="customerSelect" required></select><input name="title" placeholder="Servicio solicitado" required><textarea name="description" placeholder="Descripción"></textarea><button>Crear orden</button></form><div id="orders"></div></div></div><button class="secondary" id="logout">Cerrar sesión</button></section></main><script>let token='';let companyId='';const el=id=>document.getElementById(id),note=t=>el('notice').textContent=t;async function api(path,method='GET',data){const r=await fetch('/api/'+path,{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}const values=form=>Object.fromEntries(new FormData(form));function item(parent,text){const d=document.createElement('div');d.className='item';d.textContent=text;parent.append(d)}async function refresh(){const [summary,customers,orders]=await Promise.all([api('summary'),api('customers'),api('orders')]);el('customerCount').textContent=summary.customers;el('customers').replaceChildren();el('orders').replaceChildren();el('customerSelect').replaceChildren();customers.forEach(c=>{item(el('customers'),c.name+' · '+(c.phone||'Sin teléfono'));const o=document.createElement('option');o.value=c.id;o.textContent=c.name;el('customerSelect').append(o)});orders.forEach(o=>item(el('orders'),o.title+' · '+o.customer+' · '+o.status))}function on(form,fn){el(form).addEventListener('submit',async e=>{e.preventDefault();try{await fn(values(e.target));note('Operación completada')}catch(err){note(err.message)}})}on('register',async b=>{const r=await api('register','POST',b);el('login').elements.companyId.value=r.companyId;note('Empresa creada. Conserva este ID: '+r.companyId)});on('login',async b=>{const r=await api('login','POST',b);token=r.token;companyId=b.companyId;el('access').classList.add('hidden');el('dashboard').classList.remove('hidden');await refresh()});on('customerForm',async b=>{await api('customers','POST',b);el('customerForm').reset();await refresh()});on('orderForm',async b=>{await api('orders','POST',b);el('orderForm').reset();await refresh()});el('logout').onclick=()=>{token='';companyId='';el('dashboard').classList.add('hidden');el('access').classList.remove('hidden')};</script></body></html>
